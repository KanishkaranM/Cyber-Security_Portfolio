<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transmission Successful | Kanishkaran</title>
    
    <!-- Fonts: JetBrains Mono for the terminal feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              cyber: {
                black: '#020202',
                dark: '#0a0a0a',
                gray: '#121212',
                green: '#00ff41',
                cyan: '#00f3ff',
                red: '#ff003c',
              }
            },
            animation: {
              'blink': 'blink 1s step-end infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              blink: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              },
              glow: {
                'from': { boxShadow: '0 0 10px #00ff41, 0 0 20px #00ff41' },
                'to': { boxShadow: '0 0 20px #00ff41, 0 0 30px #00ff41' },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #020202;
        color: #e5e5e5;
        font-family: 'JetBrains Mono', monospace;
      }
      .glass-panel {
        background: rgba(10, 10, 10, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 255, 65, 0.2);
      }
      .text-shadow-neon {
        text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
      }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute inset-0 z-0">
      <div class="absolute top-20 left-10 w-72 h-72 bg-cyber-green/5 rounded-full blur-[100px]"></div>
      <div class="absolute bottom-20 right-10 w-96 h-96 bg-cyber-cyan/5 rounded-full blur-[100px]"></div>
      <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
    </div>

    <div class="z-10 max-w-md w-full mx-4">
      <div class="glass-panel p-8 rounded-xl border border-cyber-green/50 shadow-[0_0_30px_rgba(0,255,65,0.1)] text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-cyber-green/10 mb-6 animate-pulse">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00ff41" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        
        <h1 class="text-3xl font-bold text-white mb-2">Transmission <span class="text-cyber-green text-shadow-neon">Successful</span></h1>
        
        <p class="text-gray-400 mb-8 font-mono text-sm">
          > Message received and decrypted.<br/>
          > I will respond to your comms shortly.
        </p>
        
        <a href="/" class="inline-flex items-center justify-center gap-2 w-full bg-cyber-green text-black font-bold py-3 px-4 rounded-md hover:bg-green-400 transition-colors shadow-[0_0_15px_rgba(0,255,65,0.3)]">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Return to Base
        </a>
      </div>
    </div>
  </body>
</html>
